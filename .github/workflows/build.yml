name: Build LINE companion IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          repository: hirakujira/LINE-Cheater-Multidevice
          ref: master
      - name: Install ldid
        run: brew install ldid
      - name: Download decrypted LINE 15.7.2 IPA
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 600 \
            'https://www.91java.com/1.ipa' --output LINE-decrypted.ipa
          test "$(stat -f%z LINE-decrypted.ipa)" -gt 50000000
          unzip -tqq LINE-decrypted.ipa
      - name: Add byte-change diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/main.py')
          s = p.read_text()
          needle = "    if (len(modified) != len(original) and not signature_growth) or any(\n"
          assert s.count(needle) == 1, 'Upstream verification code changed'
          diagnostic = (
              "    allowed_flags = list(allowed)\n"
              "    invalid = [i for i, ok in zip(changed, allowed_flags) if not ok]\n"
              "    print('DIAG original_size', len(original), 'modified_size', len(modified), flush=True)\n"
              "    print('DIAG changed_count', len(changed), 'invalid_count', len(invalid), flush=True)\n"
              "    print('DIAG invalid_first_64', [hex(i) for i in invalid[:64]], flush=True)\n"
              "    print('DIAG changed_first_64', [hex(i) for i in changed[:64]], flush=True)\n"
              "    print('DIAG injection', injection, 'signature_growth', signature_growth, flush=True)\n"
              "    allowed = iter(allowed_flags)\n"
          )
          p.write_text(s.replace(needle, diagnostic + needle))
          PY
      - name: Recognize ldid LINKEDIT VM size update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/main.py')
          s = p.read_text()
          old = "        linkedit_file_size = linkedit_file_size_range(modified)\n"
          new = old + (
              "        linkedit_vm_size = range(linkedit_file_size.start - 16, linkedit_file_size.start - 8)\n"
              "        linkedit_file_size_value = int.from_bytes(modified[linkedit_file_size.start:linkedit_file_size.stop], 'little')\n"
              "        linkedit_vm_size_value = int.from_bytes(modified[linkedit_vm_size.start:linkedit_vm_size.stop], 'little')\n"
              "        if linkedit_vm_size_value != (linkedit_file_size_value + 0x3fff) & ~0x3fff:\n"
              "            raise AssertionError('Unexpected __LINKEDIT VM size after ldid signing')\n"
          )
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = "i in signature_command or i in linkedit_file_size"
          assert s.count(old) == 1
          s = s.replace(old, "i in signature_command or i in linkedit_file_size or i in linkedit_vm_size")
          p.write_text(s)
          PY
      - name: Patch and verify
        run: |
          set -euo pipefail
          mkdir -p output
          python3 tools/main.py --legacy-keychain-compat --require-push --allow-unverified LINE-decrypted.ipa output/LINE-15.7.2-companion.ipa 2>&1 | tee output/build-log.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LINE-build-diagnostics
          path: output/build-log.txt
          retention-days: 3
          if-no-files-found: warn
      - name: Upload verified IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LINE-15.7.2-companion
          path: output/LINE-15.7.2-companion.ipa
          retention-days: 1
          if-no-files-found: error
