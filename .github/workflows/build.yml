name: Build LINE companion IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          repository: hirakujira/LINE-Cheater-Multidevice
          ref: master
      - name: Install ldid
        run: brew install ldid
      - name: Download private input IPA
        env:
          IPA_URL: ${{ secrets.LINE_IPA_URL }}
        run: |
          set -euo pipefail
          test -n "$IPA_URL" || { echo "Set repository secret LINE_IPA_URL first"; exit 1; }
          curl --fail --location --silent --show-error --retry 2 "$IPA_URL" --output LINE-decrypted.ipa
          unzip -tqq LINE-decrypted.ipa
      - name: Patch, preserve APNs entitlements, and sign
        run: |
          mkdir -p output
          python3 tools/main.py --legacy-keychain-compat --require-push --allow-unverified LINE-decrypted.ipa output/LINE-15.7.2-companion.ipa
      - name: Upload built IPA
        uses: actions/upload-artifact@v4
        with:
          name: LINE-15.7.2-companion
          path: output/LINE-15.7.2-companion.ipa
          retention-days: 1
          if-no-files-found: error
